<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniRoute WebReady</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f1a; color: #e2e8f0; min-height: 100vh; }
    .container { max-width: 1000px; margin: 0 auto; padding: 2rem; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid #1e293b; }
    h1 { font-size: 1.5rem; font-weight: 600; }
    .status { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .card { background: #1e293b; border-radius: 0.75rem; padding: 1.5rem; border: 1px solid #334155; }
    .card h3 { font-size: 0.875rem; color: #94a3b8; margin-bottom: 0.5rem; }
    .card .value { font-size: 1.5rem; font-weight: 600; }
    .chat-container { background: #1e293b; border-radius: 0.75rem; border: 1px solid #334155; display: flex; flex-direction: column; height: 500px; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 1rem; }
    .message { margin-bottom: 1rem; padding: 0.75rem; border-radius: 0.5rem; }
    .message.user { background: #334155; margin-left: 2rem; }
    .message.assistant { background: #0f172a; margin-right: 2rem; }
    .message .role { font-size: 0.75rem; color: #94a3b8; margin-bottom: 0.25rem; }
    .chat-input { display: flex; padding: 1rem; border-top: 1px solid #334155; gap: 0.5rem; }
    .chat-input input { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; padding: 0.75rem; color: #e2e8f0; font-size: 0.875rem; }
    .chat-input input:focus { outline: none; border-color: #6366f1; }
    .chat-input button { background: #6366f1; color: white; border: none; border-radius: 0.5rem; padding: 0.75rem 1.5rem; cursor: pointer; font-weight: 500; }
    .chat-input button:hover { background: #4f46e5; }
    .chat-input button:disabled { opacity: 0.5; cursor: not-allowed; }
    .config { margin-bottom: 1rem; }
    .config label { display: block; font-size: 0.875rem; color: #94a3b8; margin-bottom: 0.25rem; }
    .config input { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; padding: 0.5rem; color: #e2e8f0; font-size: 0.875rem; }
    .badge { display: inline-block; padding: 0.125rem 0.5rem; border-radius: 999px; font-size: 0.75rem; background: #334155; color: #94a3b8; margin-right: 0.25rem; }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .tab { background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; padding: 0.5rem 1rem; cursor: pointer; font-size: 0.875rem; }
    .tab.active { background: #6366f1; border-color: #6366f1; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .provider-list { list-style: none; }
    .provider-list li { padding: 0.5rem; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; }
    .provider-list li:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🚀 OmniRoute WebReady</h1>
      <div class="status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Checking...</span>
      </div>
    </header>

    <div class="grid">
      <div class="card">
        <h3>Active Providers</h3>
        <div class="value" id="providerCount">-</div>
      </div>
      <div class="card">
        <h3>Routing</h3>
        <div class="value">Auto-fallback</div>
      </div>
      <div class="card">
        <h3>Backend</h3>
        <div class="value">Cloudflare Workers</div>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="chat">Chat</div>
      <div class="tab" data-tab="models">Models</div>
      <div class="tab" data-tab="config">Config</div>
    </div>

    <div class="tab-content active" id="tab-chat">
      <div class="chat-container">
        <div class="chat-messages" id="messages"></div>
        <div class="chat-input">
          <input type="text" id="messageInput" placeholder="Type a message..." />
          <button id="sendBtn">Send</button>
        </div>
      </div>
    </div>

    <div class="tab-content" id="tab-models">
      <div class="card">
        <h3>Available Models</h3>
        <ul class="provider-list" id="modelList"></ul>
      </div>
    </div>

    <div class="tab-content" id="tab-config">
      <div class="card">
        <h3>Configuration</h3>
        <div class="config">
          <label>API Endpoint</label>
          <input type="text" id="apiEndpoint" value="/v1" />
        </div>
        <div class="config">
          <label>API Key (optional)</label>
          <input type="password" id="apiKey" placeholder="sk-..." />
        </div>
        <div class="config">
          <label>Model</label>
          <input type="text" id="model" value="auto" />
        </div>
      </div>
    </div>
  </div>

  <script>
    // Load saved config
    const savedEndpoint = localStorage.getItem('omniroute_endpoint') || '/v1';
    const savedApiKey = <REDACTED> || '';
    const savedModel = localStorage.getItem('omniroute_model') || 'auto';

    document.getElementById('apiEndpoint').value = savedEndpoint;
    document.getElementById('apiKey').value = savedApiKey;
    document.getElementById('model').value = savedModel;

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
        if (tab.dataset.tab === 'models') loadModels();
      });
    });

    // Check backend health
    async function checkHealth() {
      try {
        const resp = await fetch('/health');
        if (resp.ok) {
          const data = await resp.json();
          document.getElementById('statusDot').style.background = '#22c55e';
          document.getElementById('statusText').textContent = `Online (${data.providers} providers)`;
          document.getElementById('providerCount').textContent = data.providers;
        } else {
          throw new Error('Not OK');
        }
      } catch (e) {
        document.getElementById('statusDot').style.background = '#ef4444';
        document.getElementById('statusText').textContent = 'Offline';
      }
    }
    checkHealth();
    setInterval(checkHealth, 30000);

    // Load models
    async function loadModels() {
      try {
        const resp = await fetch('/v1/models');
        const data = await resp.json();
        const list = document.getElementById('modelList');
        list.innerHTML = data.data.map(m => `
          <li>
            <span>${m.id}</span>
            <span class="badge">${m.owned_by}</span>
          </li>
        `).join('');
      } catch (e) {
        document.getElementById('modelList').innerHTML = '<li>Failed to load models</li>';
      }
    }

    // Chat
    const messages = [];
    const messagesEl = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    function addMessage(role, content) {
      const msg = document.createElement('div');
      msg.className = 'message ' + role;
      msg.innerHTML = `<div class="role">${role}</div><div>${content}</div>`;
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;

      const endpoint = document.getElementById('apiEndpoint').value;
      const apiKey = <REDACTED>
      const model = document.getElementById('model').value;

      localStorage.setItem('omniroute_endpoint', endpoint);
      localStorage.setItem('omniroute_api_key', apiKey);
      localStorage.setItem('omniroute_model', model);

      messages.push({ role: 'user', content: text });
      addMessage('user', text);
      messageInput.value = '';
      sendBtn.disabled = true;

      try {
        const headers = { 'Content-Type': 'application/json' };
        if (apiKey) <REDACTED> = `Bearer ${apiKey}`;

        const resp = await fetch(`${endpoint}/chat/completions`, {
          method: 'POST',
          headers,
          body: JSON.stringify({
            model: model,
            messages: messages,
            stream: false
          })
        });

        const data = await resp.json();
        if (data.choices && data.choices[0]) {
          messages.push(data.choices[0].message);
          addMessage('assistant', data.choices[0].message.content);
        } else if (data.error) {
          addMessage('assistant', `Error: ${data.error.message}`);
        }
      } catch (e) {
        addMessage('assistant', `Error: ${e.message}`);
      }

      sendBtn.disabled = false;
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
